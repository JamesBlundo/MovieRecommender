<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Titles - CineMatch</title>
</head>
<body>
<h1>Your Library</h1>
<p><a href="/titles/new">Add a Title</a></p>
<p><a href="/recommendations">Recommendations</a></p>


<p><a href="/">Home</a></p>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Release Year</th>
        <th>Genres</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${titles}">
        <td th:text="${t.id}"></td>
        <td>
            <a th:href="@{/titles/{id}(id=${t.id})}" th:text="${t.name}"></a>
        </td>
        <td th:text="${t.type}"></td>
        <td th:text="${t.releaseYear}"></td>
        <td>
            <span th:each="g, iter : ${t.genres}">
            <span th:text="${g.name}"></span><span th:if="${!iter.last}">, </span>
            </span>
        </td>

    </tr>
    </tbody>
</table>
</body>
</html>
