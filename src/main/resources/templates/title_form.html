<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Title - CineMatch</title>
</head>
<body>
<h1>Add a Title</h1>

<p><a href="/titles">Back to Library</a></p>

<form th:action="@{/titles}" th:object="${titleCreateRequest}" method="post">

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}" />
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div>
        <label>Type:</label>
        <select th:field="*{type}">
            <option value="">-- Select --</option>
            <option value="MOVIE">Movie</option>
            <option value="SHOW">Show</option>
        </select>
        <div th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
    </div>

    <div>
        <label>Release Year (optional):</label>
        <input type="number" th:field="*{releaseYear}" min="1880" max="2100" />
        <div th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></div>
    </div>

    <button type="submit">Create</button>
</form>

</body>
</html>
